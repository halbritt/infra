# /etc/imessage-vm/vm.conf — non-secret VM settings read by imessage-vm-run.
# Identity (serial, MLB, UUID, ROM, MAC) lives in /var/lib/imessage-vm/identity/identity.env.
VM_RAM_MIB=8192
VM_SMP=4
VM_CORES=2
VM_THREADS=2
# Loopback-only host forwards into the guest (QEMU user networking).
GUEST_SSH_FWD=127.0.0.1:10022
GUEST_BLUEBUBBLES_FWD=127.0.0.1:11234
GUEST_BLUEBUBBLES_PORT=1234
# yes only while installing macOS or using macOS Recovery.
ATTACH_RECOVERY=no
