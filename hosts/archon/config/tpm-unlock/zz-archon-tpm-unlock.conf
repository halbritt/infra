# /etc/mkinitcpio.conf.d/zz-archon-tpm-unlock.conf (infra hosts/archon/config/tpm-unlock)
# Sorts after Omarchy's omarchy_hooks.conf/omarchy_resume.conf and rewrites
# their busybox HOOKS into the systemd equivalents, so sd-encrypt can unlock
# root with the TPM (rd.luks.options=...=tpm2-device=auto on the cmdline).
# Omarchy's own conditionals (kms, vconsole FILES) still apply upstream of this.
if [[ " ${HOOKS[*]} " == *" encrypt "* ]]; then
  _archon_hooks=()
  for _archon_hook in "${HOOKS[@]}"; do
    case $_archon_hook in
      udev) _archon_hooks+=(systemd) ;;
      encrypt) _archon_hooks+=(sd-encrypt) ;;
      keymap) _archon_hooks+=(sd-vconsole) ;;
      consolefont) ;;  # covered by sd-vconsole
      btrfs-overlayfs) _archon_hooks+=(sd-btrfs-overlayfs) ;;
      resume) ;;  # systemd resumes from resume= itself
      *) _archon_hooks+=("$_archon_hook") ;;
    esac
  done
  HOOKS=("${_archon_hooks[@]}")
  unset _archon_hooks _archon_hook
fi
