# 2026-08-20: swapped Q5_K_M -> UD-Q4_K_M and -c 65536 -> 131072. The Council
# qwen-chair turn on long topics exceeds 65536 (measured 85k tokens on
# quartermaster); Q4_K_M (15.3 GiB) frees the VRAM for the doubled q8_0 KV.
# Prior config saved as override.pre-q4km-ctx-20260820.
# Serve Qwen3.8-27B dense (Q5_K_M) — swapped in 2026-08-14 after a clean
# before/after eval beat Qwen3.6-27B on perplexity by 26.6% (see README
# "Why Qwen3.8-27B" + ~/git/qwen-eval/results/*.log). Replaces the
# Qwen3.6-35B-A3B MoE + Striatum-FT LoRA config of 2026-06/2026-08-03.
# -c 65536 plus explicit all-layer GPU placement keeps dense 27B, q8_0 KV,
# and its MTP draft within the 24 GiB RTX 3090. --fit off makes contention a
# visible load failure instead of silently moving layers to CPU; see the
# 2026-08-18 throughput incident and measurements in README. The 3.8-27B
# carries MTP nextn tensors (qwen35.nextn_predict_layers), so draft-mtp is
# enabled. No LoRA: the Striatum-FT adapter is 35B-specific and does not load
# on 27B.
# Revert to the 35B-A3B MoE: this file's sibling override.pre-qwen3.8-20260814
# (on-box) or the previous commit.
# --metrics: Prometheus-compatible /metrics on :8081 (llamacpp:* series), scraped by the
# local Prometheus via 127.0.0.1 — see observability/prometheus/prometheus.yml (job llama).
[Service]
ExecStart=
ExecStart=/home/halbritt/git/llama.cpp/build/bin/llama-server \
    -m /home/halbritt/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_M.gguf \
    -c 131072 \
    -ctk q8_0 \
    -ctv q8_0 \
    -fa on \
    -np 1 \
    -ngl all \
    -ngld all \
    --fit off \
    --spec-type draft-mtp \
    --spec-draft-n-max 2 \
    --spec-draft-p-min 0.0 \
    --temp 0.6 \
    --top-p 0.95 \
    --top-k 20 \
    --min-p 0.0 \
    --jinja \
    --metrics \
    --host 0.0.0.0 \
    --port 8081 \
    --alias qwen3.8-27b
