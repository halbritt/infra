      TODOIST_IMPORT_WORKER_PREFETCH_MULTIPLIER: ${TODOIST_IMPORT_WORKER_PREFETCH_MULTIPLIER:-1}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Hangar}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-}
      ADMIN_WEBAUTHN_REQUIRED: ${ADMIN_WEBAUTHN_REQUIRED:-1}
      ADMIN_2FA_PENDING_ASSERT_WINDOW: ${ADMIN_2FA_PENDING_ASSERT_WINDOW:-300}
      ADMIN_2FA_PENDING_ENROLL_WINDOW: ${ADMIN_2FA_PENDING_ENROLL_WINDOW:-900}
      ADMIN_2FA_CHALLENGE_TTL: ${ADMIN_2FA_CHALLENGE_TTL:-300}
      ADMIN_2FA_MAX_ATTEMPTS: ${ADMIN_2FA_MAX_ATTEMPTS:-5}
      SESSION_COOKIE_NAME: hangar-test-session-id
    depends_on:
    - plane-db
    - plane-redis
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${PGDATABASE:-plane}
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in hangar.env}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
    volumes:
    - pgdata:/var/lib/postgresql/data
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
    - redisdata:/data
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in hangar.env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
  plane-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set in hangar.env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set in hangar.env}
    volumes:
    - uploads:/export
  proxy:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-proxy:${APP_RELEASE:-stable}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
    - 127.0.0.1:8290:80
    volumes:
    - proxy_config:/config
    - proxy_data:/data
    depends_on:
    - web
    - api
    - space
    - admin
    - live
    networks:
    - default
    - ingress
volumes:
  pgdata: null
  redisdata: null
  uploads: null
  logs_api: null
  logs_worker: null
  logs_import-worker: null
  logs_mail-worker: null
  logs_beat-worker: null
  logs_migrator: null
  rabbitmq_data: null
  proxy_config: null
  proxy_data: null
name: hangar-test
networks:
  default:
    internal: true
  ingress: {}
