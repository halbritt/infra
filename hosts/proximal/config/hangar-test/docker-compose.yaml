services:
  web:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-web:${APP_RELEASE:-stable}
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - worker
    volumes:
    - ./config.js:/usr/share/nginx/html/config.js:ro
  space:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-space:${APP_RELEASE:-stable}
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - worker
    - web
    volumes:
    - ./config.js:/usr/share/nginx/html/config.js:ro
  admin:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-admin:${APP_RELEASE:-stable}
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - web
    volumes:
    - ./config.js:/usr/share/nginx/html/config.js:ro
  live:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-live:${APP_RELEASE:-stable}
    environment:
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - web
  api:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
    - logs_api:/code/plane/logs
    environment:
      EMAIL_DELIVERY_V2_ENABLED: ${EMAIL_DELIVERY_V2_ENABLED:-0}
      EMAIL_OPENPGP_ENABLED: ${EMAIL_OPENPGP_ENABLED:-0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_MESSAGE_ID_DOMAIN: ${EMAIL_MESSAGE_ID_DOMAIN:-hangar.invalid}
      EMAIL_GPG_BINARY: ${EMAIL_GPG_BINARY:-gpg}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-30}
      EMAIL_MAX_STORED_PAYLOAD_BYTES: ${EMAIL_MAX_STORED_PAYLOAD_BYTES:-8388608}
      EMAIL_MAX_ATTACHMENT_BYTES: ${EMAIL_MAX_ATTACHMENT_BYTES:-5242880}
