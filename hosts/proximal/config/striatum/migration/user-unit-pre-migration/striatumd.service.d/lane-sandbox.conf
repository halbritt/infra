[Service]
# RFC 0096 V2 / RFC 0110 L2 — #87 lane-isolation host adoption (2026-06-06).
# Launch supervised lanes as a dedicated, PG-less, login-less OS user. The host
# provides: the `striatum-lane` system user (no PG role), a pg_hba.conf reject
# rule for it over the local socket + loopback TCP, and passwordless sudo from
# the daemon user to that account (/etc/sudoers.d/striatum-lane). With this set,
# the daemon launches lanes via `sudo -n -u striatum-lane -- env -i ...` and
# doctor reports lane_pg_isolated=true. See docs/how-to/lane-sandbox.md.
Environment=STRIATUM_LANE_OS_USER=striatum-lane
# Secure-profile gate: doctor treats lane PG reachability as a BLOCKING problem
# instead of an advisory warning. Fails closed if the lane user is missing or
# equals the daemon user. The host posture above satisfies it.
Environment=STRIATUM_SECURITY_PG_SOCKET_HARDENED=1
