[Service]
# RFC 0122 (#212) — enable the daemon-side supervision.auto_spawn scheduler.
# With this set, striatumd runs the resident scheduler loop that spawns a run's
# lanes from its captured run-owner spawn-authorization grant with NO operator
# RPC after run.start. It only acts on runs whose workflow opted a lane into
# supervision.auto_spawn AND whose run.start captured a grant; absent that it is
# inert. Disable = remove this drop-in + `systemctl --user daemon-reload` +
# restart.
Environment=STRIATUM_AUTO_SPAWN_SCHEDULER=1
