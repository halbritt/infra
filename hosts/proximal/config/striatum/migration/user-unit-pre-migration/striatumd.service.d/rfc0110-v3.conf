[Service]
# RFC 0110 N+1 — live v3 cutover (2026-06-04).
# Owner PEER DSN for the L0 credential bootstrap (rotates striatumd_rw +
# registers the per-instance authority secret over the owner connection).
Environment=STRIATUM_OWNER_DB_URL=postgres://halbritt@/striatum_daemon?host=/var/run/postgresql
# Forward-only audit cutover: the daemon writes audit rows via the in-DB
# SECURITY DEFINER append_audit_row (hash_format_version=3). Rollback = v2 +
# re-grant INSERT on audit_log to striatumd_rw + restart.
Environment=STRIATUM_AUDIT_HASH_FORMAT=v3
# RFC 0110 Phase 2 (full, 2026-06-04) — route ALL durable append-only writes
# (audit_log + artifacts + events) through their owner-owned SECURITY DEFINER
# append functions; lockstep with owner bundle 0004 (append_event_row +
# REVOKE INSERT ON striatumd.events). This is the sole-durable-write-path
# posture: the doctor pg_write_boundary=full claim now holds. Rollback to P1 =
# set this back to audit_artifacts + re-GRANT INSERT ON striatumd.events TO
# striatumd_rw (as owner) + restart (bundle 0004 is additive; the binary still
# supports the SD path, so the re-grant + flag are sufficient to fall back).
Environment=STRIATUM_PG_WRITE_BOUNDARY=full
