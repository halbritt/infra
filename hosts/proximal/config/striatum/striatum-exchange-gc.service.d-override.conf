# 2026-09-03 — Principal instruction RQ-373383 §4.5: "Exchange GC stays at the
# 6-hour window as the standing value until STRNEX-73 lands." RQ-133468's
# deterministic 272 MB refusal loop refilled ~37 GB/day of dispatch inputs and
# filled the disk to 100 % on 2026-09-02 22:5xZ; the daily 72 h window is not
# enough headroom while any such loop can recur. Revert by deleting this
# drop-in (the unit's own ExecStart keeps -older-than 72h) once STRNEX-73 lands.
[Service]
ExecStart=
ExecStart=%h/.local/bin/striatum -repo %h/git/striatum-next -data-home %h/.local/share -catalog %h/.local/share/striatum/semantics/current/catalog -backends %h/.local/share/striatum/semantics/current/backends -policy %h/.local/share/striatum/semantics/current/policy/driver.yaml -quota %h/.local/share/striatum/semantics/current/policy/quota.yaml exchange-gc -older-than 6h
