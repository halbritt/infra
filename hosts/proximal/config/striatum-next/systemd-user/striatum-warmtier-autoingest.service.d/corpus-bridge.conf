# Corpus-export bridge (memory-lives@1, 2026-07-07).
#
# The old striatum CLI in ~/.local/bin was replaced by the striatum-next
# binary on 2026-07-02 ("archrem"), which has no `corpus` verb; the exhaust
# and lane-trajectory feedstocks parked on it. This drop-in prepends a bridge
# dir whose `striatum` symlink points at the pre-archrem binary so
# `striatum corpus export` works again inside this unit only.
#
# This is a NAMED BRIDGE, not the destination: the direction of record is a
# striatum-next-native corpus export (ledger/object-store sourced), a further
# intent under memory-lives.
[Service]
Environment=PATH=%h/.local/lib/striatum-warmtier/bridge-bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
