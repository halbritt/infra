# /etc/tmpfiles.d/tmp.conf — overrides /usr/lib/tmpfiles.d/tmp.conf (Ubuntu ships 30d).
# Age out /tmp files neither read nor written (atime+mtime) for 2 days; directories by mtime.
# ctime is ignored on purpose: tree moves/hardlinks refresh it and kept 130G+ of cold files alive.
# Agent runs, Go build caches and scratch dirs filled 377G of / within the 30d window.
D /tmp 1777 root root amM:2d

# Never age out live systemd PrivateTmp dirs (upstream systemd excludes these too).
x /tmp/systemd-private-%b-*
X /tmp/systemd-private-%b-*/tmp
