# proximal observability: bind nvidia_gpu_exporter to the tailnet IP 100.85.100.81
# (no host firewall, so binding the specific tailnet IP is what keeps it off LAN 192.168.1.92).
# The tailnet IP exists only after tailscaled brings the interface up — wait for it and self-heal
# if the bind races startup. Also clears the .deb unit's all-interfaces ExecStart and re-points it.
[Unit]
Wants=network-online.target
After=network-online.target tailscaled.service

[Service]
ExecStart=
ExecStart=/usr/bin/nvidia_gpu_exporter --web.listen-address=100.85.100.81:9835
Restart=on-failure
RestartSec=5
