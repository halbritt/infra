# Custom postgres_exporter queries for proximal — cluster metrics + PG17/18 compatibility.
# Loaded via ARGS --extend.query-path. Runs against the primary connection (postgres).
# NOTE: postgres_exporter 0.15.0 has two built-in collectors broken on PG17, disabled in ARGS
# and replaced here: stat_bgwriter (checkpoint cols moved to pg_stat_checkpointer) and
# stat_statements (blk_read_time split in pg_stat_statements 1.11).

# --- Checkpointer (PG17 pg_stat_checkpointer) — replaces broken stat_bgwriter ---------------
# num_requested should stay ~0; a climbing rate means WAL pressure forcing checkpoints
# (validates max_wal_size=16GB).
pg_checkpointer:
  query: |
    SELECT num_timed, num_requested, write_time, sync_time, buffers_written
    FROM pg_stat_checkpointer
  master: true
  metrics:
    - num_timed:       {usage: "COUNTER", description: "Scheduled (timed) checkpoints"}
    - num_requested:   {usage: "COUNTER", description: "Requested/forced checkpoints — should stay ~0"}
    - write_time:      {usage: "COUNTER", description: "ms spent writing checkpoint buffers"}
    - sync_time:       {usage: "COUNTER", description: "ms spent syncing checkpoint files"}
    - buffers_written: {usage: "COUNTER", description: "Buffers written during checkpoints"}

# --- Bgwriter (PG17 pg_stat_bgwriter, surviving columns) -------------------------------------
pg_bgwriter:
  query: |
    SELECT buffers_clean, maxwritten_clean, buffers_alloc
    FROM pg_stat_bgwriter
  master: true
  metrics:
    - buffers_clean:    {usage: "COUNTER", description: "Buffers written by bgwriter"}
    - maxwritten_clean: {usage: "COUNTER", description: "Times bgwriter stopped at maxwritten"}
    - buffers_alloc:    {usage: "COUNTER", description: "Buffers allocated"}

# --- Top statements (pg_stat_statements 1.11) — replaces broken stat_statements collector ----
# Bounded to top 25 by total exec time to keep cardinality sane.
pg_stat_statements_top:
  query: |
    SELECT
      d.datname AS datname,
      r.rolname AS usename,
      s.queryid::text AS queryid,
      left(regexp_replace(s.query, '\s+', ' ', 'g'), 120) AS short_query,
      s.calls           AS calls,
      s.total_exec_time AS total_exec_time_ms,
      s.mean_exec_time  AS mean_exec_time_ms,
      s.rows            AS rows,
      s.shared_blks_hit  AS shared_blks_hit,
      s.shared_blks_read AS shared_blks_read
    FROM pg_stat_statements s
    JOIN pg_database d ON d.oid = s.dbid
    JOIN pg_roles    r ON r.oid = s.userid
    WHERE s.calls > 0
    ORDER BY s.total_exec_time DESC
    LIMIT 25
  master: true
  metrics:
    - datname:            {usage: "LABEL", description: "Database"}
    - usename:            {usage: "LABEL", description: "Role"}
    - queryid:            {usage: "LABEL", description: "Normalized query id"}
    - short_query:        {usage: "LABEL", description: "First 120 chars of normalized query"}
    - calls:              {usage: "COUNTER", description: "Number of executions"}
    - total_exec_time_ms: {usage: "COUNTER", description: "Total execution time (ms)"}
    - mean_exec_time_ms:  {usage: "GAUGE",   description: "Mean execution time (ms)"}
    - rows:               {usage: "COUNTER", description: "Rows retrieved/affected"}
    - shared_blks_hit:    {usage: "COUNTER", description: "Shared buffer hits"}
    - shared_blks_read:   {usage: "COUNTER", description: "Shared blocks read from disk"}
