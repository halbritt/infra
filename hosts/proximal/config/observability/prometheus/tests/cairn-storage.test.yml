rule_files:
- ../rules/cairn-storage.rules.yml
evaluation_interval: 1m
tests:
- name: large steady
  interval: 1m
  input_series:
  - series: pg_database_size_bytes{instance="proximal",datname="cairn",cluster="18/main",job="postgresql"}
    values: 171798691840+0x500
  alert_rule_test:
  - eval_time: 29m
    alertname: CairnDatabaseLarge
    exp_alerts: []
  - eval_time: 30m
    alertname: CairnDatabaseLarge
    exp_alerts:
    - exp_labels: &id001
        instance: proximal
        datname: cairn
        cluster: 18/main
        job: postgresql
        severity: warning
      exp_annotations:
        summary: Cairn database exceeds 150 GiB
        description: Inspect the Cairn storage dashboard and retrieval-candidate retention;
          do not delete audit rows without checking consumers.
  - eval_time: 7h
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
- name: threshold boundary
  interval: 1m
  input_series:
  - series: pg_database_size_bytes{instance="proximal",datname="cairn",cluster="18/main",job="postgresql"}
    values: 161061273600+0x500
  alert_rule_test:
  - eval_time: 29m
    alertname: CairnDatabaseLarge
    exp_alerts: []
  - eval_time: 30m
    alertname: CairnDatabaseLarge
    exp_alerts: []
  - eval_time: 7h
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
- name: fast growth
  interval: 1m
  input_series:
  - series: pg_database_size_bytes{instance="proximal",datname="cairn",cluster="18/main",job="postgresql"}
    values: 107374182400+3000000x500
  alert_rule_test:
  - eval_time: 20m
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
  - eval_time: 7h
    alertname: CairnDatabaseGrowingFast
    exp_alerts:
    - exp_labels: *id001
      exp_annotations:
        summary: Cairn database growing faster than 2 GiB/day
        description: The six-hour size trend exceeds 2 GiB/day. Check candidate insert/delete
          rates and table sizes.
- name: slow growth
  interval: 1m
  input_series:
  - series: pg_database_size_bytes{instance="proximal",datname="cairn",cluster="18/main",job="postgresql"}
    values: 107374182400+1000000x500
  alert_rule_test:
  - eval_time: 20m
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
  - eval_time: 7h
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
- name: shrinking
  interval: 1m
  input_series:
  - series: pg_database_size_bytes{instance="proximal",datname="cairn",cluster="18/main",job="postgresql"}
    values: 107374182400-1000000x500
  alert_rule_test:
  - eval_time: 20m
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
  - eval_time: 7h
    alertname: CairnDatabaseGrowingFast
    exp_alerts: []
- name: missing table metrics
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 4m
    alertname: CairnStorageMetricsUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: CairnStorageMetricsUnavailable
    exp_alerts:
    - exp_labels:
        job: cairn-postgresql
        table: retrieval_candidate
        severity: warning
      exp_annotations:
        summary: Cairn table storage metrics unavailable
        description: Check prometheus-postgres-exporter-cairn and its read-only database
          connection.
- name: candidate retention running
  interval: 1h
  input_series:
  - series: pg_cairn_table_inserted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+5000x200
  - series: pg_cairn_table_deleted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+5000x200
  alert_rule_test:
  - eval_time: 7d
    alertname: CairnCandidateRetentionStalled
    exp_alerts: []
- name: first expiry within a day of a new relation does not alert
  interval: 1h
  input_series:
  - series: pg_cairn_table_inserted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+5000x200
  - series: pg_cairn_table_deleted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+0x12 1000+5000x187
  alert_rule_test:
  - eval_time: 1d
    alertname: CairnCandidateRetentionStalled
    exp_alerts: []
  - eval_time: 7d
    alertname: CairnCandidateRetentionStalled
    exp_alerts: []
- name: candidate retention stalled
  interval: 1h
  input_series:
  - series: pg_cairn_table_inserted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+5000x300
  - series: pg_cairn_table_deleted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 0+5000x120 600000+0x180
  alert_rule_test:
  - eval_time: 8d
    alertname: CairnCandidateRetentionStalled
    exp_alerts: []
  - eval_time: 10d2h
    alertname: CairnCandidateRetentionStalled
    exp_alerts:
    - exp_labels:
        job: cairn-postgresql
        instance: proximal
        datname: cairn
        schema: cairn
        table: retrieval_candidate
        severity: warning
      exp_annotations:
        summary: Cairn candidate detail is not being expired
        description: Rows were inserted for four days with none deleted. Check cairn-candidate-retention.timer
          and its journal; see hosts/proximal/config/cairn/candidate-retention.md.
- name: quiet store is not a stalled store
  interval: 1h
  input_series:
  - series: pg_cairn_table_inserted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 500000+0x200
  - series: pg_cairn_table_deleted_total{job="cairn-postgresql",instance="proximal",datname="cairn",schema="cairn",table="retrieval_candidate"}
    values: 500000+0x200
  alert_rule_test:
  - eval_time: 7d
    alertname: CairnCandidateRetentionStalled
    exp_alerts: []
