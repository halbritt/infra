groups:
  - name: cairn_storage
    rules:
      - alert: CairnDatabaseLarge
        expr: pg_database_size_bytes{datname="cairn"} > 150 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cairn database exceeds 150 GiB"
          description: "Inspect the Cairn storage dashboard and retrieval-candidate retention; do not delete audit rows without checking consumers."
      - alert: CairnDatabaseGrowingFast
        expr: deriv(pg_database_size_bytes{datname="cairn"}[6h]) * 86400 > 2 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cairn database growing faster than 2 GiB/day"
          description: "The six-hour size trend exceeds 2 GiB/day. Check candidate insert/delete rates and table sizes."
      - alert: CairnCandidateRetentionStalled
        expr: increase(pg_cairn_table_inserted_total{job="cairn-postgresql",table="retrieval_candidate"}[4d]) > 0 and increase(pg_cairn_table_deleted_total{job="cairn-postgresql",table="retrieval_candidate"}[4d]) == 0
        for: 1d
        labels:
          severity: warning
        annotations:
          summary: "Cairn candidate detail is not being expired"
          description: "Rows were inserted for four days with none deleted. Check cairn-candidate-retention.timer and its journal; see hosts/proximal/config/cairn/candidate-retention.md."
      - alert: CairnStorageMetricsUnavailable
        expr: (pg_exporter_last_scrape_error{job="cairn-postgresql"} > 0) or absent(pg_cairn_table_total_bytes{job="cairn-postgresql",table="retrieval_candidate"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cairn table storage metrics unavailable"
          description: "Check prometheus-postgres-exporter-cairn and its read-only database connection."
