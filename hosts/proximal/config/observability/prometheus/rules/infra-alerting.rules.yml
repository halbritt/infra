# proximal-authored cross-cutting infra alerting rules. Installed to
# /etc/victoria-metrics/rules/infra-alerting.rules.yml. NOT vendored — authored here. `up` is
# synthesized by VictoriaMetrics for every scrape target, so this covers all jobs
# (prometheus/node/postgresql/gpu×3/gpu-fleet/llama) uniformly — a down exporter is a blind spot.
groups:
  - name: infra_alerts
    rules:
      # Any scrape target unreachable for 10m. for:10m rides out service restarts; the peecee GPU
      # target (off-box Windows host) can legitimately flap when that machine sleeps — silence it
      # there rather than loosening the rule for everything.
      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "scrape target {{ $labels.job }} / {{ $labels.instance }} is down"
          description: "The metrics backend has not scraped {{ $labels.job }} on {{ $labels.instance }} for 10m (up=0) — metrics for it are blind."

  # gpu-fleet registry (job "gpu-fleet", :9188 — second postgres_exporter instance reading
  # database gpu_fleet). The registry is the routing truth for multi-host inference: slots
  # graduate unverified -> probationary -> routable (migration 009) and evaporate from the
  # live/routable views when their heartbeat ages past the 45s TTL. Exporter-down blindness
  # is covered by the generic TargetDown above (the summary series just goes absent).
  - name: gpu_fleet_alerts
    rules:
      # Whole-fleet outage: no slot is both live and routable, so every consumer pick fails.
      # The summary query always returns exactly one row, so this is a real 0, not absence.
      # for:3m rides out a single node's heartbeat blip or a probationary re-graduation.
      - alert: GpuFleetZeroRoutableSlots
        expr: pg_gpu_fleet_summary_routable_slots == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "gpu-fleet has ZERO routable slots"
          description: "No slot is live AND status='routable' for 3m — every fleet consumer pick fails. Check heartbeats (gpu-fleet-heartbeat) and slot status: psql -d gpu_fleet -c 'TABLE gpu_slots'."

      # Dead heartbeat writer on a registered slot. 90s = 2x the 45s live TTL: by the time
      # this fires the slot has long since evaporated from live_slots/routable_slots, so
      # this is about a WEDGED/dead heartbeat process, not a transient miss. Rows persist
      # after a node leaves, so a deliberately decommissioned slot alerts until its row is
      # DELETEd from gpu_slots — that is intended (silent zombie rows are the failure mode).
      - alert: GpuFleetHeartbeatStale
        expr: pg_gpu_fleet_slot_heartbeat_age_seconds > 90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "gpu-fleet heartbeat stale on {{ $labels.node }} {{ $labels.endpoint_url }}"
          description: "Slot {{ $labels.node }}/{{ $labels.endpoint_url }}/{{ $labels.slot_id }} last heartbeat {{ $value | humanize }}s ago (>90s = 2x the 45s live TTL) — the heartbeat writer is dead or wedged, or the slot row needs deleting. Check gpu-fleet heartbeat units/journal on {{ $labels.node }}."

  # llama-server (job "llama", :8081) — the most load-bearing service on the box: every
  # praxis/engram/mining call hits it. Series are llamacpp:* from --metrics (see
  # llama/llama-27b.service.d/override.conf). NOTE: this llama.cpp build (76da2450a) exposes
  # NO KV-cache-usage series — upstream removed kv_cache_usage_ratio/kv_cache_tokens (only a
  # stale reference in tools/server/bench/bench.py remains), so queue depth
  # (requests_deferred) is the pressure signal, not cache fill.
  - name: llama_alerts
    rules:
      # Down fast: unlike the generic TargetDown (for:10m), 1m is deliberate — a normal
      # restart (model load ~20-30s, scrape every 15s) stays pending and never fires, but a
      # real outage of the primary endpoint should page well before 10m of blindness.
      - alert: LlamaServerDown
        expr: up{job="llama"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "llama-server (:8081) is down"
          description: "The metrics backend cannot scrape llama-server on {{ $labels.instance }} (up=0 for 1m) — the primary inference endpoint is unreachable. Check: systemctl status llama-27b / journalctl -u llama-27b."

      # Demand, not utilization: the unit runs -np 1 (one full-context slot), so any
      # deferred request means callers are queueing behind the busy slot. Sustained 5m of
      # queueing = real contention (a lone burst rides out the `for`). A long-running
      # mining job holding the slot with NO queue behind it stays silent by design.
      - alert: LlamaSlotSaturated
        expr: llamacpp:requests_deferred > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "llama-server requests queueing behind the single slot"
          description: "llama-server on {{ $labels.instance }} has had {{ $value }} deferred request(s) for 5m — demand exceeds the single -np 1 slot. Long jobs (mining/backfill) may be starving interactive callers."
