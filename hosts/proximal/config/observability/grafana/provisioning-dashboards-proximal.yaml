apiVersion: 1
providers:
  - name: proximal
    orgId: 1
    folder: proximal
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  # Dashboards reading Home Assistant telemetry (VictoriaMetrics plus retained
  # InfluxDB rollback dashboards), NOT proximal host metrics. Kept in their own path so the proximal
  # provider above (which recurses its path) doesn't also claim them.
  - name: homeassistant
    orgId: 1
    folder: Home Assistant
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards-homeassistant
      foldersFromFilesStructure: false
