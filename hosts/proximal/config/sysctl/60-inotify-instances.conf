# proximal: per-user limit on inotify instances. The kernel default (128) ran out
# on 2026-11-27: agent sessions and headless slicer GUIs held all of them, and
# inotify_init1 failed with EMFILE for every other process of the user.
# Record: infra hosts/proximal/config/sysctl/README.md
fs.inotify.max_user_instances = 1024
