# talos: installed as /etc/needrestart/conf.d/50-infra-container-runtime.conf.
# Never restart the container runtime after library upgrades; that would stop
# running agent-ee containers. Restarted at the next guarded reboot instead.
$nrconf{override_rc}{qr(^docker\.service$)} = 0;
$nrconf{override_rc}{qr(^docker\.socket$)} = 0;
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
