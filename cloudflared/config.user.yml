# User-scope fallback config. The live tunnel runs from the system unit
# (cloudflared.service --config /etc/cloudflared/config.yml). Keep the ingress
# below identical to /etc/cloudflared/config.yml so an ad-hoc
# `cloudflared tunnel run` as halbritt routes the same way; only
# credentials-file differs (this one is halbritt-readable, /etc is root-only).
tunnel: e6e104cb-75a2-4ccc-a46f-aca2c725328c
credentials-file: /home/halbritt/.cloudflared/e6e104cb-75a2-4ccc-a46f-aca2c725328c.json

ingress:
  - hostname: tailscale.harm.org
    service: http://localhost:3912
  - hostname: tokens.harm.org
    service: http://localhost:3001
  - hostname: dram.harm.org
    service: http://localhost:3011
  - hostname: plane.harm.org
    service: http://localhost:8190
  - service: http_status:404
