id: front_door_myra_google_home
alias: Front door unlock for Myra and Adam
description: >-
  Owner-authorized unlock from a fresh Google Home front-door camera notification
  naming Myra or Adam, forwarded by the Moto Companion app. Field mapping was
  verified against recorded Adam alerts; physical arrival unlock is unverified.
triggers:
  - trigger: state
    entity_id: sensor.moto_g_power_5g_2024_last_notification
    id: google_home_notification
conditions:
  - condition: trigger
    id: google_home_notification
  - alias: Require a fresh named front-door alert, not a replay or restored state
    condition: template
    value_template: >-
      {% if trigger is not defined or trigger.from_state is none or trigger.to_state is none %}
        {{ false }}
      {% else %}
        {% set a = trigger.to_state.attributes %}
        {% set posted = a.get('post_time', 0) | float(0) / 1000 %}
        {% set previous_run = as_timestamp(this.attributes.get('last_triggered'), 0) %}
        {% set title = a.get('android.title', '') | string %}
        {% set text = a.get('android.text', '') | string %}
        {{ a.get('package') == 'com.google.android.apps.chromecast.app'
           and (a.get('channel_id', '') | string).startswith('CameraChannel-')
           and text == 'Front door doorbell'
           and title | lower in ['myra seen', 'adam seen']
           and 0 <= as_timestamp(now()) - posted <= 60
           and posted > previous_run
           and as_timestamp(now()) - previous_run >= 60 }}
      {% endif %}
  - condition: state
    entity_id: lock.aqara_smart_lock_u200
    state: locked
actions:
  - alias: Manual Run actions must not unlock the door
    condition: trigger
    id: google_home_notification
  - action: lock.unlock
    target:
      entity_id: lock.aqara_smart_lock_u200
mode: single
trace:
  stored_traces: 20
