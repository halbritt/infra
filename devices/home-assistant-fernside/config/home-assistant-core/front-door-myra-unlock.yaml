id: front_door_myra_google_home
alias: Front door unlock for Myra and Adam
description: >-
  Owner-authorized unlock for a fresh Myra or Adam recognition from the front-door
  Google Home camera, correlated to a Nest Pub/Sub event by google_home_faces.
  Heath push-to-name delivery is verified; Myra/Adam physical unlock remains unverified.
triggers:
  - trigger: event
    event_type: google_home_familiar_face
    event_data:
      device_id: 47edf5f6c5b076ff9f9864f412bdb750
      resource_id: device@a260ebff-09f1-4e5b-b5f4-1f9986f0e42a
    id: google_home_face
conditions:
  - condition: trigger
    id: google_home_face
  - alias: Require a fresh allowed recognition, not a replay
    condition: template
    value_template: >-
      {% if trigger is not defined or trigger.event is not defined %}
        {{ false }}
      {% else %}
        {% set a = trigger.event.data %}
        {% set occurred = as_timestamp(a.get('trigger_timestamp'), 0) %}
        {% set seen = as_timestamp(a.get('face_last_seen'), 0) %}
        {% set observed = as_timestamp(a.get('observed_at'), 0) %}
        {% set previous_run = as_timestamp(this.attributes.get('last_triggered'), 0) %}
        {% set current = as_timestamp(now()) %}
        {{ a.get('device_id') == '47edf5f6c5b076ff9f9864f412bdb750'
           and a.get('resource_id') == 'device@a260ebff-09f1-4e5b-b5f4-1f9986f0e42a'
           and a.get('name', '') | string | lower in ['myra', 'adam']
           and a.get('trigger_type') in ['doorbell_chime', 'camera_person']
           and a.get('recognition_id') is string and a.get('recognition_id') | length > 0
           and 0 <= current - occurred <= 60
           and 0 <= current - seen <= 60
           and 0 <= current - observed <= 10
           and occurred > previous_run
           and current - previous_run >= 60 }}
      {% endif %}
  - condition: state
    entity_id: lock.aqara_smart_lock_u200
    state: locked
actions:
  - alias: Manual Run actions must not unlock the door
    condition: trigger
    id: google_home_face
  - action: lock.unlock
    target:
      entity_id: lock.aqara_smart_lock_u200
mode: single
trace:
  stored_traces: 20
