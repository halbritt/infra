# Serve Qwen3.6-35B-A3B MoE for skill-mining stage2 (backfill done 2026-06-11).
# -np 1: full 262144 ctx in a SINGLE slot so large per-bucket stage2 prompts
# (~140k tok) fit. MoE (3B active) is far faster than 27B dense at this ctx.
# Same VRAM as -np 4 (total ctx unchanged); loses concurrent slots (fine now
# that the parallel backfill workers are gone).
# Revert to stock 27B: sudo rm -r /etc/systemd/system/llama-27b.service.d && sudo systemctl daemon-reload && sudo systemctl restart llama-27b
[Service]
ExecStart=
ExecStart=/home/halbritt/git/llama.cpp/build/bin/llama-server \
    -m /home/halbritt/models/Qwen3.6-35B-A3B-APEX-I-Compact.gguf \
    -c 262144 \
    -ctk q8_0 \
    -ctv q8_0 \
    -fa on \
    -np 1 \
    --temp 0.6 \
    --top-p 0.95 \
    --top-k 20 \
    --min-p 0.0 \
    --jinja \
    --host 0.0.0.0 \
    --port 8081 \
    --alias qwen3.6-35b-a3b
