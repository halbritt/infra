# Drop-in for the (still user-scoped) striatum-warmtier-autoingest.service.
# Install path: ~/.config/systemd/user/striatum-warmtier-autoingest.service.d/daemon-socket.conf
#
# The autoingest exhaust leg shells out to the `striatum` CLI (corpus export),
# which talks to striatumd. striatumd moved to a system unit with its socket and
# runtime files under /run/striatum; this user unit's XDG_RUNTIME_DIR still points
# at /run/user/1000, so without these the CLI would dial the old, empty socket.
# Pin both so the exhaust leg reaches the system daemon.
[Service]
# RPC socket is nested in rpc/ (lane-ACL reason — see striatumd.service).
Environment=STRIATUM_DAEMON_RUNTIME_DIR=/run/striatum
Environment=STRIATUM_DAEMON_SOCKET=/run/striatum/rpc/daemon-go.sock
