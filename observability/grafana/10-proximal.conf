# proximal observability: admin secret (out of git) + tailnet-bind ordering/self-heal.
[Unit]
Wants=network-online.target
After=network-online.target tailscaled.service postgresql.service

[Service]
EnvironmentFile=/etc/grafana/admin.env
EnvironmentFile=-/etc/grafana/ha-influx.env
Restart=on-failure
RestartSec=5
