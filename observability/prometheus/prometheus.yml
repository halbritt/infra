# proximal observability — Prometheus scrape config.
# Listen address is set via ARGS in /etc/default/prometheus (tailnet 100.85.100.81:9091;
# default :9090 is taken by cockpit.socket). All targets bind the tailnet IP.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: proximal

# Alertmanager (prometheus-alertmanager.service) on the tailnet IP :9093. Routes the rules
# below to Slack #proximal-alerts — see observability/alertmanager/. After changing this,
# promtool check config && sudo systemctl reload prometheus, then confirm at
# :9091/api/v1/alertmanagers (activeAlertmanagers should list 100.85.100.81:9093).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['100.85.100.81:9093']

# Rule files. The striatum pair is vendored verbatim from the striatum repo
# (go/pkg/metrics/rules/) — recording rules pre-aggregate the counters/histograms the alerts and
# dashboard read; alerting rules map each striatumd failure class to a signal. The node/gpu/
# postgres/infra files are proximal-AUTHORED (not vendored) against this host's own exporters —
# every series verified live. All route to Slack #proximal-alerts via the Alertmanager above.
# Refresh the striatum copies from the striatum checkout (see README "striatumd exporter").
rule_files:
  - /etc/prometheus/rules/striatum-recording.rules.yml
  - /etc/prometheus/rules/striatum-alerting.rules.yml
  - /etc/prometheus/rules/node-alerting.rules.yml
  - /etc/prometheus/rules/gpu-alerting.rules.yml
  - /etc/prometheus/rules/postgres-alerting.rules.yml
  - /etc/prometheus/rules/infra-alerting.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['100.85.100.81:9091']

  - job_name: postgresql
    static_configs:
      - targets: ['100.85.100.81:9187']
        labels:
          instance: proximal
          cluster: '17/main'

  - job_name: node
    static_configs:
      - targets: ['100.85.100.81:9100']
        labels:
          instance: proximal

  - job_name: gpu
    static_configs:
      - targets: ['100.85.100.81:9835']
        labels:
          instance: proximal
          gpu: 'rtx-3090'
      # peecee — Windows 11 workstation, RTX 3090 Ti, nvidia_gpu_exporter as a
      # WinSW service bound to its tailnet IP (see nvidia-gpu-exporter-peecee/).
      - targets: ['100.113.63.58:9835']
        labels:
          instance: peecee
          gpu: 'rtx-3090-ti'

  # striatumd RFC 0137 exporter. /metrics is multiplexed onto the daemon's loopback
  # MCP/HTTP listener, pinned to 127.0.0.1:9464 via STRIATUM_DAEMON_MCP_HTTP_ADDR in
  # the striatumd.service unit (it binds a random port per boot otherwise). Loopback
  # + tokenless by RFC 0137 §4; Prometheus runs on this host so it scrapes directly,
  # no TLS/bearer. Do NOT move this to the tailnet IP — keep /metrics off-box (front
  # it with `tailscale serve` + a scoped token if remote scrape is ever needed).
  - job_name: striatumd
    static_configs:
      - targets: ['127.0.0.1:9464']
        labels:
          instance: proximal

  # llama-server (llama-27b.service) — the box's primary inference endpoint. /metrics is
  # enabled via --metrics in the unit's drop-in override (see llama/llama-27b.service.d/)
  # and multiplexed onto the API port :8081. The server binds 0.0.0.0, but scrape via
  # loopback per the striatumd precedent — no reason to route the scrape over the tailnet.
  # Series are llamacpp:* (colon-namespaced, tokenless). Alerts: rules/infra-alerting.rules.yml.
  - job_name: llama
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          instance: proximal
