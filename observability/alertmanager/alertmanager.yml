# proximal observability — Alertmanager config.
# Canonical copy; installed to /etc/prometheus/alertmanager.yml. Edit here, then
#   sudo cp observability/alertmanager/alertmanager.yml /etc/prometheus/alertmanager.yml
#   amtool check-config /etc/prometheus/alertmanager.yml && sudo systemctl reload prometheus-alertmanager
#
# Routing decision (2026-06-20, with the operator): every alert → one Slack channel
# #proximal-alerts via a dedicated Slack app "proximal-alerts" (workspace gearheads),
# isolated from the praxis app. Notifications post through an incoming webhook whose URL is
# the one secret here — it is NOT in git; Alertmanager reads it from a 0640 root:prometheus
# file via api_url_file (see slack_webhook_url.template). The two striatumd severity tiers
# (`page`, `warning`) share the channel but get different urgency: pages notify fast and
# re-alert hourly; warnings batch and re-alert every 4h.

global:
  resolve_timeout: 5m

# A firing `page` for the same alertname+instance suppresses a `warning` for the same pair —
# don't double-notify when the severe signal already fired.
inhibit_rules:
  - source_matchers: ['severity = "page"']
    target_matchers: ['severity = "warning"']
    equal: ['alertname', 'instance']

route:
  receiver: slack-proximal-alerts
  # Group by the alert and where it came from so one Slack message collapses related firings.
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s          # wait for siblings before the first notification
  group_interval: 5m       # min gap before notifying about new alerts in an existing group
  repeat_interval: 4h      # re-send an unresolved group at most this often (warnings)
  routes:
    # Pages (NecrosisRate, DoctorRed, SupervisorOriginFlood) — notify fast, nag hourly.
    - matchers: ['severity = "page"']
      receiver: slack-proximal-alerts
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: slack-proximal-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_url   # the incoming-webhook URL (secret, not in git)
        channel: '#proximal-alerts'                         # webhook is already bound to this channel; kept for clarity
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
          {{ .CommonLabels.alertname }}
          {{- if .CommonLabels.severity }} ({{ .CommonLabels.severity }}){{ end }}
        title_link: '{{ .ExternalURL }}/#/alerts?receiver=slack-proximal-alerts'
        text: >-
          {{ range .Alerts -}}
          *{{ .Status | toUpper }}* — {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end }}*labels:* {{ range .Labels.SortedPairs }}`{{ .Name }}={{ .Value }}` {{ end }}
          {{ end }}
