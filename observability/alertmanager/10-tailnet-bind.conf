# proximal observability: Alertmanager binds tailnet IP 100.85.100.81 (set in
# /etc/default/prometheus-alertmanager), which exists only after tailscaled brings the
# interface up. Wait for it and self-heal if the bind races startup. Same drop-in the
# prometheus/node/postgres/gpu units use.
# Installed to /etc/systemd/system/prometheus-alertmanager.service.d/10-tailnet-bind.conf
[Unit]
Wants=network-online.target
After=network-online.target tailscaled.service

[Service]
Restart=on-failure
RestartSec=5
